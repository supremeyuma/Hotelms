[package]
name = "print-bridge"
version = "0.1.0"
description = "Local ESC/POS print bridge daemon for the club POS"
edition = "2024"

[[bin]]
name = "print-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
