[package]
name = "desktop"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Auto-update: the updater verifies a minisign signature before installing, and
# the process plugin relaunches the app after the installer finishes.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# `default-features = false` drops the TLS backend too; without it a terminal
# cannot reach an https peer, so the cloud fallback would fail to connect.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.22"
rand = "0.8"
ulid = "1"
local-ip-address = "0.6"
# Licence verification: RSA-SHA256 signature check against the embedded public
# key, plus date handling for the trial and licence term.
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
chrono = "0.4"

# e2e-only: the WebdriverIO Tauri plugins. Both are optional and reachable only
# through the `e2e` feature, which is deliberately absent from `default`, so a
# normal (release) build never links a WebDriver server or the execute/mock
# command surface. Build the app under test with:
#   cargo build --features e2e
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-wdio = { version = "1", optional = true }

[features]
# Test-only. Enables the embedded WebDriver server
# (tauri-plugin-wdio-webdriver) and the execute/mock plugin
# (tauri-plugin-wdio) used by @wdio/tauri-service. Never add this to `default`.
e2e = ["tauri-plugin-wdio-webdriver", "tauri-plugin-wdio"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
