name: release

# Builds, signs and publishes a MooreLife release.
#
# The updater artifacts are signed with TAURI_SIGNING_PRIVATE_KEY (minisign), so
# installed copies can verify an update before running it. tauri-action also
# writes latest.json, which tauri-plugin-updater polls at
# https://github.com/supremeyuma/Hotelms/releases/latest/download/latest.json
#
# Manual only, deliberately: `scripts/release.ps1` already publishes on a tag, so
# a tag trigger here would race it and double-publish the same version. Run this
# workflow by hand with an existing tag when building from CI.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/moorelife.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#
# The bundled PHP/FrankenPHP runtime and the trimmed Postgres runtime are not in
# git (too large; .gitignore). They are downloaded from the `runtime-v1` release
# asset built from a machine that has them vendored. Laravel's `vendor/` is not
# in git either, so Composer has to run before the app is staged.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        shell: pwsh
        # The installer ships the Laravel app, so vendor/ must exist before
        # stage-app.ps1 copies the tree.
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Fetch the vendored Windows runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release download runtime-v1 `
            --repo ${{ github.repository }} `
            --pattern desktop-runtime-windows-x64.zip `
            --dir $env:RUNNER_TEMP
          Expand-Archive "$env:RUNNER_TEMP\desktop-runtime-windows-x64.zip" `
            -DestinationPath resources -Force
          if (-not (Test-Path "resources/bin/x86_64-pc-windows-msvc/frankenphp.exe")) {
            throw "runtime bundle is missing FrankenPHP"
          }
          if (-not (Test-Path "resources/postgres-runtime/x86_64-pc-windows-msvc/pgsql/bin/postgres.exe")) {
            throw "runtime bundle is missing Postgres"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.tag }}
          releaseName: "MooreLife ${{ inputs.tag }}"
          releaseBody: "Windows installer. See the release notes in the repository for verification details."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
