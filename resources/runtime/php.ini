; MooreLife bundled runtime — PHP configuration for the FrankenPHP build.
;
; Shared extensions live under ext/ and the shipped php.ini-production has every
; extension= line commented out, so a bare `php -m` reports them missing even
; though the DLLs are present. This file is copied next to the runtime's PHP
; binary at packaging time; `extension_dir` is relative to this file.
;
; Verify with: scripts/verify-runtime.ps1 -RuntimeDir <runtime dir>
extension_dir = "ext"

extension=curl
extension=exif
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_pgsql
extension=pdo_sqlite
extension=pgsql
extension=sodium
extension=sqlite3
extension=zip
